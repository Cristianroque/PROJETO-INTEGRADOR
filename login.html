<html lang="pt-br">

<head>

    <title>Quinta do Ypuã</title>
    <link rel="stylesheet" href="./assets/style/cadastro.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"

        <div class="boxPrincipal">
            <div class="displayLogin">
                <div class="logoBox">
                    <img width="200px" src="./assets/img/integrador.png" alt="">
                </div>
                <div class="infoContaBox">
                    <div class="infoConta">
                        <div class="inputs">
                            <div class="textsInputs">

                                <p>Insira as informações para acessar a sua conta</p>
                            </div>
            
                            <div>
                                <p>Email</p>
                                <input type="email" name="" id="" placeholder="Ensira seu e-mail">
                            </div>
                            <div>
                                <p>Senha</p>
                                <input type="password" name="" id="" placeholder="Ensira sua senha">
                            </div>

                            <button><a href="./index.html">Acessar</a></button>
                            <div class="boxBTNcadastro">
                                <p>Não possui uma conta? <a href="./cadastro.html">Criar uma conta conta</a></p>

                        </div>
                    </div>
                </div>
            </div>
            <div class="displayImg">

            </div>
        </div>
